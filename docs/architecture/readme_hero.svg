      <path d="M980 181C989 153 1016 153 1024 174" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 6"/>
      <circle cx="980" cy="182" r="5" fill="#6EE7B7"/>
      <path d="M1024 163L1027 175L1015 172" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1002" y="211" fill="#E0F2FE" font-size="11" font-weight="700" text-anchor="middle">NAV2</text>
    </g>
    <g>
