      <path d="M1142 184V166L1156 154L1170 165L1160 175L1178 184" fill="none" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1136" y="184" width="48" height="8" rx="4" fill="#6EE7B7" fill-opacity="0.85"/>
      <text x="1163" y="211" fill="#D1FAE5" font-size="11" font-weight="700" text-anchor="middle">PICK &amp; PLACE</text>
    </g>
