      <ellipse cx="857" cy="157" rx="20" ry="8" fill="none" stroke="#7DD3FC" stroke-width="3"/>
      <path d="M837 157V177C837 181 846 185 857 185C868 185 877 181 877 177V157M837 167C837 171 846 175 857 175C868 175 877 171 877 167" fill="none" stroke="#7DD3FC" stroke-width="3"/>
      <text x="857" y="211" fill="#E0F2FE" font-size="11" font-weight="700" text-anchor="middle">SEMANTIC DB</text>
    </g>
    <g>
