<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Mobile Manipulation</title>
  <desc id="desc">Composable orchestration for navigation and whole-body pick and place</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0B2341"/>
      <stop offset="1" stop-color="#123E64"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="90" r="260" fill="url(#glow)"/>
  <rect x="55" y="48" width="238" height="30" rx="15" fill="#0F3151" stroke="#38BDF8" stroke-opacity="0.55"/>
  <circle cx="75" cy="63" r="5" fill="#6EE7B7"/>
  <text x="90" y="68" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">ROS 2 ORCHESTRATION</text>

  <text x="55" y="143" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="720">Semantic Mobile</text>
  <text x="55" y="198" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="720">Manipulation</text>
  <rect x="56" y="218" width="380" height="4" rx="2" fill="url(#accent)"/>
  <text x="55" y="258" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Composable intelligence. Deterministic control.</text>
  <text x="55" y="289" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Natural language to autonomous navigation and whole-body Pick &amp; Place.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="M758 180H811M903 180H956M1048 180H1101" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
    <path d="M802 173L812 180L802 187M947 173L957 180L947 187M1092 173L1102 180L1092 187" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g>
      <rect x="666" y="128" width="92" height="104" rx="16" fill="#0D2A47" stroke="#38BDF8" stroke-opacity="0.8"/>
      <circle cx="712" cy="165" r="20" fill="#0EA5E9" fill-opacity="0.18"/>
      <path d="M702 160H722M702 168H716" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
