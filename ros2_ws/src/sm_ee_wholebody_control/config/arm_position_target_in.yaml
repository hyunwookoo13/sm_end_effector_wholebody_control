arm_yaw_rho_z_position_controller:
  ros__parameters:
    use_sim_time: true
    arm_base_frame: link0
    base_frame: chassis_link
    ee_frame: end_effector_link
    target_frame: target_in
    joint_state_topic: /joint_states
    joint_position_topic: /joint_position_command
    cmd_topic: /cmd_vel
    state_topic: /arm_safety_state
    rate_hz: 40.0

    yaw_error_source: ee
    joint1_sign: 1.0
    joint2_sign: 1.0
    joint3_sign: 1.0

    joint2_rho_per_rad: 0.2715
    joint2_z_per_rad: -0.1972
    joint3_rho_per_rad: 0.1521
    joint3_z_per_rad: -0.2631

    k_yaw: 2.5
    k_rho: 2.0
    k_z: 2.5
    max_yaw_velocity: 0.8
    max_rho_velocity: 0.22
    max_z_velocity: 0.22
    max_joint_velocity: 1.5
    max_joint2_velocity: 1.0
    max_joint3_velocity: 1.5
    max_joint_acceleration: 3.0
    approach_slowdown_distance: 0.08
    approach_min_scale: 0.35

    yaw_tolerance: 0.04
    rho_tolerance: 0.03
    z_tolerance: 0.03
    singularity_epsilon: 0.01

    # ARM_TRACK is entered only inside this smaller workspace.
    safety_enter_rho_min: 0.20
    safety_enter_rho_max: 0.55
    safety_enter_z_min: 0.25
    safety_enter_z_max: 0.78
    safety_enter_yaw_max: 1.0472

    # Wider exit boundary prevents rapid state switching near the edge.
    safety_exit_rho_min: 0.15
    safety_exit_rho_max: 0.65
    safety_exit_z_min: 0.20
    safety_exit_z_max: 0.85
    safety_exit_yaw_max: 1.3090

    home_positions: [0.0, -1.5708, 2.0944, -0.5236, 1.5708, 0.0]
    home_kp: 2.0
    home_max_joint_velocity: 1.0
    home_position_tolerance: 0.03

    base_stop_rho: 0.50
    switching_rho: 0.55
    switching_alpha: 20.0
    arm_switching_rho: 0.75
    arm_switching_alpha: 10.0
    arm_blend_exponent: 0.5
    base_yaw_tolerance: 0.08
    k_base_yaw: 2.0
    k_base_linear: 2.4
    max_base_yaw_rate: 1.4
    max_base_linear: 1.0
    enable_base_motion: false
    hold_wrist_during_place: true
    grasp_orientation_wrist_mode: link6
    grasp_link6_orientation_offset: 0.0
    grasp_link6_axis: "y"
    grasp_gripper_closing_axis: "x"
    grasp_target_closing_axis: "y"
    require_wrist_alignment_before_descend: true
    wrist_orientation_tolerance: 0.12

    # Joint safety position limits in radians.
    # joint1: -40 to 40 deg, joint2: -90 to 70 deg, joint3: -60 to 160 deg.
    joint_lower_limits: [-0.6981, -1.5708, -1.0472, -3.1416, -3.1416, -3.1416]
    joint_upper_limits: [0.6981, 1.2217, 2.7925, 3.1416, 3.1416, 3.1416]

    # Grasp sequence parameters
    grasp_descend_speed: 0.3
    grasp_lift_speed: 0.3
    grasp_lift_height: 0.12
    grasp_descend_depth: 0.07
    # Keep horizontal approach above the object; final descend height is unchanged.
    grasp_approach_clearance_z: 0.03
    grasp_close_duration: 0.1
    gripper_open_position: 0.0
    gripper_close_position: 0.8
    grasp_offset_z: 0.03
    place_offset_z: 0.10
    place_descend_depth: 0.04
    place_open_duration: 0.8
    return_home_after_place: true
    gripper_joint_names: ["rh_l1", "rh_r1_joint"]
