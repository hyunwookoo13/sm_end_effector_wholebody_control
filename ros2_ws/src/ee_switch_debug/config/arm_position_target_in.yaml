arm_yaw_rho_z_position_controller:
  ros__parameters:
    use_sim_time: true
    arm_base_frame: link0
    base_frame: chassis_link
    ee_frame: end_effector_link
    target_frame: target_in
    joint_state_topic: /joint_states
    joint_position_topic: /joint_position_command
    cmd_topic: /cmd_vel
    state_topic: /arm_safety_state
    rate_hz: 40.0

    yaw_error_source: ee
    joint1_sign: 1.0
    joint2_sign: 1.0
    joint3_sign: 1.0

    joint2_rho_per_rad: 0.2715
    joint2_z_per_rad: -0.1972
    joint3_rho_per_rad: 0.1521
    joint3_z_per_rad: -0.2631

    k_yaw: 2.5
    k_rho: 2.0
    k_z: 2.5
    max_yaw_velocity: 0.8
    max_rho_velocity: 0.22
    max_z_velocity: 0.22
    max_joint_velocity: 1.5
    max_joint2_velocity: 1.0
    max_joint3_velocity: 1.5
    max_joint_acceleration: 3.0
    approach_slowdown_distance: 0.08
    approach_min_scale: 0.35

    yaw_tolerance: 0.04
    rho_tolerance: 0.03
    z_tolerance: 0.03
    singularity_epsilon: 0.01

    # ARM_TRACK is entered only inside this smaller workspace.
    safety_enter_rho_min: 0.20
    safety_enter_rho_max: 0.55
    safety_enter_z_min: 0.25
    safety_enter_z_max: 0.78
    safety_enter_yaw_max: 1.0472

    # Wider exit boundary prevents rapid state switching near the edge.
    safety_exit_rho_min: 0.15
    safety_exit_rho_max: 0.65
    safety_exit_z_min: 0.20
    safety_exit_z_max: 0.85
    safety_exit_yaw_max: 1.3090

    home_positions: [0.0, -1.5708, 2.0944, -0.5236, 1.5708, 0.0]
    home_kp: 2.0
    home_max_joint_velocity: 1.0
    home_position_tolerance: 0.03

    base_stop_rho: 0.50
    switching_rho: 0.55
    switching_alpha: 20.0
    arm_switching_rho: 0.75
    arm_switching_alpha: 10.0
    arm_blend_exponent: 0.5
    base_yaw_tolerance: 0.08
    k_base_yaw: 2.0
    k_base_linear: 2.4
    max_base_yaw_rate: 1.4
    max_base_linear: 1.0
    enable_base_motion: false
    hold_wrist_during_place: true
    # 실제 로봇용 단계별 속도/가속도 제한입니다.
    position_stage_yaw_velocity: 0.35
    position_stage_joint2_velocity: 0.60
    position_stage_joint3_velocity: 0.80
    position_stage_wrist_velocity: 0.30
    wrist_stage_yaw_velocity: 0.25
    wrist_stage_joint2_velocity: 0.25
    wrist_stage_joint3_velocity: 0.35
    wrist_stage_wrist_velocity: 0.35
    # WRIST 중 EE 위치가 밀리면 link2·3이 보정하고 손목은 저속으로 계속 정렬합니다.
    wrist_recovery_yaw_velocity: 0.22
    wrist_recovery_joint2_velocity: 0.30
    wrist_recovery_joint3_velocity: 0.42
    # 위치를 복구하는 동안에도 손목 정렬이 교착되지 않도록 아주 천천히 진행합니다.
    wrist_recovery_wrist_velocity: 0.08
    wrist_recovery_acceleration: 0.75
    wrist_recovery_enter_error_m: 0.05
    wrist_recovery_exit_error_m: 0.025
    # Soft posture envelope 초과가 이 값 이하이면 clamp 후 실제 EE 회전 오차로 판정합니다.
    max_wrist_target_clamp_rad: 0.35
    pregrasp_stage_yaw_velocity: 0.18
    pregrasp_stage_joint2_velocity: 0.20
    pregrasp_stage_joint3_velocity: 0.28
    pregrasp_stage_wrist_velocity: 0.22
    descend_stage_yaw_velocity: 0.12
    descend_stage_joint2_velocity: 0.08
    descend_stage_joint3_velocity: 0.12
    descend_stage_wrist_velocity: 0.12
    position_stage_acceleration: 1.4
    wrist_stage_acceleration: 0.9
    pregrasp_stage_acceleration: 0.65
    descend_stage_acceleration: 0.30
    joint_soft_limit_margin: 0.12
    # PICK 시작 자세에서 허용하는 최대 이동량 [joint1..joint6], rad.
    pick_max_joint_excursion: [0.65, 1.80, 2.00, 1.40, 1.40, 2.00]
    # sm_grasping_ros2/grasp_best의 전체 orientation을 link4·5·6으로 추종합니다.
    grasp_orientation_wrist_mode: full
    grasp_link6_orientation_offset: 0.0
    grasp_link6_axis: "y"
    grasp_gripper_closing_axis: "x"
    grasp_target_closing_axis: "y"
    require_wrist_alignment_before_descend: true
    wrist_orientation_tolerance: 0.12

    # Full six-axis IK is solved once, then fixed joint groups are executed.
    # The dedicated top-down launch enables this mode.
    enable_precomputed_top_down_sequence: false
    top_down_use_fixed_reachable_orientation: false
    top_down_use_group_sequential_approach: false
    top_down_blend_orientation_during_descent: false
    top_down_pregrasp_clearance: 0.10
    top_down_waypoint_spacing: 0.02
    top_down_radial_inward_offset: 0.025
    top_down_approach_joint_step: 0.12
    top_down_minimum_approach_clearance: 0.08
    top_down_minimum_orientation_fraction: 0.50
    top_down_orientation_search_steps: 20
    top_down_descend_max_xy_deviation: 0.015
    top_down_descend_max_orientation_deviation: 0.035
    top_down_segment_min_duration: 0.8
    # Bounded endpoint feedback compensates steady-state simulator/actuator lag.
    top_down_settle_max_command_offset: 0.10
    top_down_joint_kp: 2.2
    top_down_joint_tolerance: 0.025
    # Generic missions stay strict; the dedicated simulator launch relaxes transit only.
    top_down_transit_joint_tolerance: 0.025
    top_down_stage_acceleration: 0.8
    top_down_lift_home_clearance: 0.06
    top_down_alignment_velocity_limits: [0.25, 0.50, 0.65, 0.45, 0.45, 0.45]
    top_down_path_velocity_limits: [0.16, 0.22, 0.28, 0.22, 0.16, 0.22]

    # Joint safety position limits in radians.
    # joint1: -40 to 40 deg, joint2: -90 to 70 deg, joint3: -60 to 160 deg.
    joint_lower_limits: [-0.6981, -1.5708, -1.0472, -3.1416, -3.1416, -3.1416]
    joint_upper_limits: [0.6981, 1.2217, 2.7925, 3.1416, 3.1416, 3.1416]

    # Grasp sequence parameters
    grasp_descend_speed: 0.3
    grasp_lift_speed: 0.3
    grasp_lift_height: 0.12
    grasp_descend_depth: 0.07
    # Keep horizontal approach above the object; final descend height is unchanged.
    grasp_approach_clearance_z: 0.03
    grasp_close_duration: 0.1
    gripper_open_position: 0.0
    gripper_close_position: 0.8
    grasp_offset_z: 0.03
    place_offset_z: 0.10
    place_descend_depth: 0.04
    place_open_duration: 0.8
    return_home_after_place: true
    gripper_joint_names: ["rh_l1", "rh_r1_joint"]
